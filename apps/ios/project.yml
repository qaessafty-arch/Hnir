# XcodeGen spec: on a Mac run `brew install xcodegen && xcodegen` in this folder, then open Darwaza.xcodeproj.
name: Darwaza
options:
  bundleIdPrefix: school.darwaza
  deploymentTarget:
    iOS: "15.0"
targets:
  Darwaza:
    type: application
    platform: iOS
    sources: [Darwaza]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: school.darwaza.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Darwaza/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
